<nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
  <div class="container">
    <span class="navbar-brand mb-0 h1">IrisManager v1.0</span>
  </div>
</nav>

<div class="container">
  <div class="row">
    <div class="col-md-4 mb-4">
      <app-customer-form 
        [customer]="newCustomer" 
        (onSave)="saveCustomer()">
      </app-customer-form>
    </div>
    
    <div class="col-md-8">
      <app-customer-list 
        [customers]="customers"
        (onEdit)="editCustomer($event)"
        (onDelete)="deleteCustomer($event)">
      </app-customer-list>
    </div>
  </div>
</div>
