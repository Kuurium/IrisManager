<form [formGroup]="customerForm" (ngSubmit)="onSubmit()" novalidate>
  
  <div class="mb-3">
    <label for="name" class="form-label">Nombre del Cliente</label>
    <input 
      type="text" 
      id="name" 
      class="form-control" 
      formControlName="name" 
      [ngClass]="{'is-invalid': customerForm.get('name')?.invalid && (customerForm.get('name')?.dirty || customerForm.get('name')?.touched)}">
    
    <div *ngIf="customerForm.get('name')?.invalid && (customerForm.get('name')?.dirty || customerForm.get('name')?.touched)" class="invalid-feedback">
      <div *ngIf="customerForm.get('name')?.hasError('required')">El nombre es obligatorio.</div>
      <div *ngIf="customerForm.get('name')?.hasError('minlength')">El nombre debe tener al menos 3 caracteres.</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Correo Electrónico</label>
    <input 
      type="email" 
      id="email" 
      class="form-control" 
      formControlName="email" 
      [ngClass]="{'is-invalid': customerForm.get('email')?.invalid && (customerForm.get('email')?.dirty || customerForm.get('email')?.touched)}">
    
    <div *ngIf="customerForm.get('email')?.invalid && (customerForm.get('email')?.dirty || customerForm.get('email')?.touched)" class="invalid-feedback">
      <div *ngIf="customerForm.get('email')?.hasError('required')">El correo es obligatorio.</div>
      <div *ngIf="customerForm.get('email')?.hasError('email')">Ingrese un formato de correo válido (ej. usuario@dominio.com).</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="phone" class="form-label">Teléfono</label>
    <input 
      type="text" 
      id="phone" 
      class="form-control" 
      formControlName="phone" 
      [ngClass]="{'is-invalid': customerForm.get('phone')?.invalid && (customerForm.get('phone')?.dirty || customerForm.get('phone')?.touched)}">
    
    <div *ngIf="customerForm.get('phone')?.invalid && (customerForm.get('phone')?.dirty || customerForm.get('phone')?.touched)" class="invalid-feedback">
      <div *ngIf="customerForm.get('phone')?.hasError('required')">El teléfono es obligatorio.</div>
      <div *ngIf="customerForm.get('phone')?.hasError('pattern')">Solo se permiten números (mínimo 8 dígitos).</div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="customerForm.invalid">
    Guardar Cliente
  </button>

</form>
