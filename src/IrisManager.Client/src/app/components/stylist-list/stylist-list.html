<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestión de Estilistas</h2>
    <button class="btn btn-primary" (click)="openModal()">
      + Nuevo Estilista
    </button>
  </div>

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div class="table-responsive" *ngIf="!isLoading">
    <table class="table table-striped table-hover shadow-sm rounded">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Especialidad</th>
          <th class="text-center">Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let stylist of stylists">
          <td>{{ stylist.id }}</td>
          <td><strong>{{ stylist.name }}</strong></td>
          <td>{{ stylist.email }}</td>
          <td>{{ stylist.phone }}</td>
          <td><span class="badge bg-info text-dark">{{ stylist.specialty }}</span></td>
          
          <td class="text-center">
            <span class="badge" [ngClass]="stylist.isActive ? 'bg-success' : 'bg-danger'">
              {{ stylist.isActive ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          
          <td class="text-center">
            <button class="btn btn-sm btn-outline-warning me-2" (click)="openModal(stylist)">Editar</button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteStylist(stylist.id)">Eliminar</button>
          </td>
        </tr>
        
        <tr *ngIf="stylists.length === 0">
          <td colspan="7" class="text-center py-4 text-muted">
            No hay estilistas registrados en el sistema.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-stylist-form 
  *ngIf="showModal" 
  [stylistToEdit]="selectedStylist" 
  (close)="closeModal()" 
  (saved)="onModalSaved()">
</app-stylist-form>
